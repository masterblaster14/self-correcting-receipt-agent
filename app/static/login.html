<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Receipt Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<style>
  .login-wrap { min-height: calc(100vh - 70px); display: grid; place-items: center; padding: 24px; }
  .login-card { width: min(440px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; box-shadow: var(--shadow); }
  .login-card h1 { font-size: 22px; letter-spacing: -.02em; margin: 14px 0 6px; }
  .login-card p { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .gbtn { width: 100%; justify-content: center; padding: 12px; font-size: 15px; }
  .gbtn svg { width: 20px; height: 20px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 16px 0; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
  .field input { padding: 11px 13px; border-radius: 11px; border: 1px solid var(--line-2); font-size: 15px; font-weight: 400; color: var(--ink); }
  .field input:focus { outline: 2px solid #c7d2fe; border-color: var(--accent); }
  .domains { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .msg { font-size: 13.5px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; }
  .msg.err { background: var(--bad-soft); color: #7f1d1d; }
  .msg.ok { background: var(--ok-soft); color: #14532d; }
  .code input { letter-spacing: .4em; font-family: var(--mono); font-size: 22px; text-align: center; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 9h6M9 12h6M9 15h4"/></svg></div>
    <div><div class="brand-name">Receipt Agent</div><div class="brand-sub">Self-correcting multimodal expense extraction</div></div>
  </div>
</header>
<div class="login-wrap">
  <div class="login-card">
    <div class="dz-icon" style="width:52px;height:52px;border-radius:14px;margin:0"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>Sign in to your organisation</h1>
    <p>Accounts are limited to organisation email addresses.</p>

    <a class="btn gbtn" id="gbtn" href="/auth/google" hidden>
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.7 2.5 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.7-2 15.5-5.6l-7.5-5.8c-2.1 1.4-4.8 2.3-8 2.3-6.3 0-11.7-4.1-13.6-9.9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Continue with Google
    </a>

    <div class="or" id="or" hidden>or use a one-time code</div>

    <form id="emailForm" hidden>
      <label class="field">Organisation email<input id="email" type="email" placeholder="you@vitstudent.ac.in" required autocomplete="email"></label>
      <label class="field" id="nameField">Your name (first sign-in)<input id="name" placeholder="e.g. Om Gunjan Gupta" autocomplete="name"></label>
      <button class="btn primary gbtn" type="submit" id="sendBtn">Email me a code</button>
    </form>

    <form id="codeForm" hidden>
      <label class="field code">6-digit code<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
      <button class="btn primary gbtn" type="submit">Sign in</button>
      <button class="btn gbtn" type="button" id="backBtn" style="margin-top:8px">Use a different email</button>
    </form>

    <div class="msg" id="msg" hidden></div>
    <div class="domains" id="domains"></div>
  </div>
</div>
<script>
(async () => {
  const $ = (i) => document.getElementById(i);
  const q = new URLSearchParams(location.search);
  const show = (t, ok) => { $("msg").hidden = false; $("msg").textContent = t; $("msg").className = "msg " + (ok ? "ok" : "err"); };
  const cfg = await (await fetch("/auth/config")).json();
  $("domains").innerHTML = cfg.domains.map((d) => `<span class="chip accent">@${d}</span>`).join("");
  if (cfg.google) $("gbtn").hidden = false;
  if (cfg.email_code) { $("emailForm").hidden = false; if (cfg.google) $("or").hidden = false; }
  if (!cfg.google && !cfg.email_code) show("Sign-in is not configured on this server.", false);
  const errs = { domain: `Only ${cfg.domains.map((d) => "@" + d).join(", ")} accounts can sign in${q.get("email") ? " (" + q.get("email") + " was refused)" : ""}.`,
                 state: "Sign-in session expired, try again.", google: "Google sign-in failed, try again.", cancelled: "Sign-in cancelled." };
  if (q.get("error")) show(errs[q.get("error")] || "Sign-in failed.", false);

  let email = "";
  $("emailForm").addEventListener("submit", async (e) => {
    e.preventDefault(); email = $("email").value.trim(); $("sendBtn").disabled = true;
    const r = await fetch("/auth/email/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email }) });
    const d = await r.json(); $("sendBtn").disabled = false;
    if (!r.ok) return show(d.detail || "Could not send code", false);
    $("emailForm").hidden = true; $("codeForm").hidden = true; $("codeForm").hidden = false; $("code").focus();
    show(`Code sent to ${email}. Check your inbox (and spam).`, true);
  });
  $("codeForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const r = await fetch("/auth/email/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, code: $("code").value.trim(), name: $("name").value.trim() }) });
    const d = await r.json();
    if (!r.ok) return show(d.detail || "Wrong code", false);
    location.href = "/";
  });
  $("backBtn").addEventListener("click", () => { $("codeForm").hidden = true; $("emailForm").hidden = false; $("msg").hidden = true; });
})();
</script>
</body>
</html>
